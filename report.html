<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PastureConnect | Report</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">🌿 PastureConnect</a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="areas.html">Resource Updates</a>
            <a href="report.html">Report</a>
            <a href="about.html">About</a>
            <a href="login.html">Login / Register</a>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Report Resource Conditions</h1>
            <p>Share information about pasture and water in your area.</p>
        </section>

        <section class="form-card">
            <h2>Submit a Report</h2>
            <p class="form-intro">
                Please provide accurate information about the conditions you observed.
            </p>

            <form id="locationForm">
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location"
                        placeholder="e.g. Garissa" required>
                </div>

                <div class="form-group">
                    <label for="type">Resource Type</label>
                    <select id="type" required>
                        <option value="" selected disabled>Choose resource type</option>
                        <option value="Pasture">Pasture</option>
                        <option value="Water">Water</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="status">Resource Condition</label>
                    <select id="status" required>
                        <option value="" selected disabled>Choose condition</option>
                        <option value="Available">Available</option>
                        <option value="Limited">Limited</option>
                        <option value="Unavailable">Unavailable</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description"
                        placeholder="Describe what you observed..."
                        required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Submit Report
                </button>

                <p id="report-message" class="message" role="status"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>PastureConnect — Supporting pastoral communities.</p>
    </footer>

    <script src="/report.js"></script>
</body>
</html>
